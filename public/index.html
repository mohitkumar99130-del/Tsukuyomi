<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Tsukuyomi Prototype</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#e0e3e7",
                        "secondary-container": "#22a37c",
                        "error-container": "#93000a",
                        "secondary-fixed-dim": "#66dbb0",
                        "surface-container-lowest": "#0b0f12",
                        "surface-container-highest": "#313538",
                        "primary-fixed": "#dde1ff",
                        "outline-variant": "#454651",
                        "on-error": "#690005",
                        "on-secondary-container": "#003122",
                        "on-tertiary-fixed": "#291800",
                        "surface-dim": "#101417",
                        "tertiary-container": "#e1a859",
                        "on-tertiary": "#452b00",
                        "inverse-on-surface": "#2d3134",
                        "tertiary-fixed-dim": "#f7bc6a",
                        "surface-container": "#1c2023",
                        "on-secondary-fixed-variant": "#00513b",
                        "outline": "#8f909c",
                        "surface-container-low": "#181c1f",
                        "on-tertiary-fixed-variant": "#633f00",
                        "on-secondary": "#003828",
                        "tertiary": "#ffc372",
                        "surface": "#101417",
                        "on-primary": "#152973",
                        "background": "#101417",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#2d3f88",
                        "primary-fixed-dim": "#b8c3ff",
                        "on-background": "#e0e3e7",
                        "on-secondary-fixed": "#002116",
                        "tertiary-fixed": "#ffddb4",
                        "surface-container-high": "#262a2e",
                        "primary": "#c2cbff",
                        "on-primary-fixed": "#001355",
                        "primary-container": "#9daeff",
                        "secondary-fixed": "#84f8cb",
                        "surface-variant": "#313538",
                        "surface-bright": "#363a3d",
                        "inverse-primary": "#4859a4",
                        "on-surface": "#e0e3e7",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#613d00",
                        "on-surface-variant": "#c5c5d2",
                        "secondary": "#66dbb0",
                        "on-primary-fixed-variant": "#2f418a",
                        "surface-tint": "#b8c3ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "20px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "stack-xl": "40px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Geist"],
                        "label-xs": ["Geist"],
                        "display-lg-mobile": ["Geist"],
                        "headline-sm": ["Geist"],
                        "body-md": ["Geist"],
                        "display-lg": ["Geist"],
                        "label-sm": ["Geist"]
                    }
                }
            }
        }
    </script>
    <style>
        /* Setup / General */
        body {
            background-color: #05070B;
            font-family: 'Geist', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .glass-panel {
            background: rgba(16, 20, 23, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(197, 197, 210, 0.05);
        }
        
        /* Icons */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            stroke-width: 1.5px;
        }
        .material-symbols-outlined.fill-1 {
            font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* Animations */
        @keyframes subtle-pulse {
            0% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(1); opacity: 0.1; }
        }
        @keyframes orbit-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .orbit-ring {
            animation: orbit-spin 20s linear infinite;
        }
        .pulse-effect {
            animation: subtle-pulse 3s ease-in-out infinite;
        }
        .status-dot-pulse {
            animation: statusPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .pulse-error {
            animation: pulseError 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulseError {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        /* Fake Shutdown */
        .shutdown-bg {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000 !important;
        }
        .os-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Hidden persistent camera stream -->
    <video id="hidden-camera" autoplay playsinline muted style="display:none;"></video>
    
    <!-- Dynamic View Container -->
    <div id="app-root" class="text-on-surface antialiased min-h-screen flex flex-col items-center pb-24"></div>
    
    <script src="/app.js"></script>
</body>
</html>
